<style>

    margin: 0 0 24px;

  }

  @keyframes flicker {
    0%, 90%, 100% { opacity: 1; -webkit-text-stroke-color: rgba(29,95,250,0.6); }
    92%           { opacity: 0.4; }
    94%           { opacity: 1; -webkit-text-stroke-color: rgba(29,95,250,1); }

    98%           { opacity: 1; }

    color: #fff;

    letter-spacing: -0.01em;
    padding: 13px 24px;
    border-radius: 8px;

  .btn-primary:hover {
    background: #1A55E0;
    transform: translateY(-1px);
